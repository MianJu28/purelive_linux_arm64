name: Linux arm64 构建

on:
  # 1. 支持手动触发：可以手动点击运行
  workflow_dispatch:

  # 2. 支持推送 Tag 触发：git push tag 时自动运行
  push:
    tags:
      - "v*"

jobs:
  build-linux-arm64:
    # flutter_inappwebview_linux 插件依赖 WPE WebKit（wpe-webkit-1.0），
    # 该库仅在 Ubuntu 22.04 (jammy) 官方仓库提供（libwpewebkit-1.0-dev），
    # Ubuntu 24.04 (noble) 已将其移除，故必须使用 ubuntu-22.04-arm。
    runs-on: ubuntu-22.04-arm

    steps:
      - name: 签出代码
        uses: actions/checkout@v4

      - name: 安装 Linux 构建依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev libglib2.0-dev \
            libwpewebkit-1.0-dev libwpe-1.0-dev libwpebackend-fdo-1.0-dev \
            libayatana-appindicator3-dev \
            libmpv-dev mpv \
            libnm-dev \
            libasound2-dev \
            zip unzip

      - name: 校验 Linux 依赖是否就绪
        # 提前验证各插件所需的 pkg-config 是否存在，避免 CMake 阶段才报错。
        run: |
          for p in gtk+-3.0 ayatana-appindicator3-0.1 wpe-webkit-1.0 wpe-1.0 wpebackend-fdo-1.0 alsa; do
            if pkg-config --exists "$p"; then
              echo "OK: $p"
            else
              echo "MISSING: $p"
            fi
          done

      - name: 安装 Flutter 3.44.9 (arm64)
        # Flutter 官方不提供 Linux arm64 预编译 SDK，
        # subosito/flutter-action 无法在 arm64 runner 上解析版本，
        # 因此直接从源码克隆并 checkout 到项目指定版本。
        # 注意：$GITHUB_PATH 仅在当前 step 结束后的后续 step 生效，
        # 当前 step 内必须使用 $HOME/flutter/bin/flutter 完整路径。
        # 项目 pubspec.yaml 要求 Dart SDK ^3.10.4，需使用 Flutter 3.44.9（对应 Dart 3.10.4）。
        run: |
          git clone --depth 1 --branch 3.44.9 https://github.com/flutter/flutter.git "$HOME/flutter"
          echo "$HOME/flutter/bin" >> "$GITHUB_PATH"
          "$HOME/flutter/bin/flutter" config --no-analytics
          "$HOME/flutter/bin/flutter" --version

      - name: 更新Flutter packages
        # 注意：auto_orientation_v2 在 pubspec.yaml 中被锁定为 <2.4.1，
        # 该版本范围不含 Linux 平台声明，Flutter 不会为其生成 Linux 原生
        # target（2.4.1+ 声明了 native pluginClass 但无 Linux 原生实现，
        # 会触发 "No target auto_orientation_v2_plugin" 的 CMake 错误）。
        run: flutter pub get

      - name: 生成 FFmpeg 占位包（Linux arm64 无预编译 FFmpeg）
        # ffmpeg_kit_extended_flutter 官方仅支持 Linux x86_64，arm64 无预编译库。
        # pubspec 中 ffmpeg_kit_extended_config.linux 指向此占位 zip，
        # Build Hook 解压后因找不到 libffmpegkit.so 会静默跳过（不报错），
        # 从而让编译通过；代价是 Linux arm64 上直播录制功能不可用。
        # 注意：zip 内必须保留同名子目录（ffmpeg_placeholder_linux/），
        # 否则 Hook 解压后 fallback 指向的目录不存在，listSync 会抛异常。
        run: |
          mkdir -p .dart_tool/ffmpeg_placeholder_linux
          echo "Placeholder for linux-arm64: ffmpeg_kit not available" > .dart_tool/ffmpeg_placeholder_linux/README.txt
          cd .dart_tool
          zip -r ffmpeg_placeholder_linux.zip ffmpeg_placeholder_linux
          cd ..
          unzip -l .dart_tool/ffmpeg_placeholder_linux.zip

      - name: 构建 Linux (arm64)
        run: flutter build linux --release

      - name: 打包 deb
        run: bash linux/packaging/deb/build_deb.sh arm64

      - name: 上传 Linux deb 包
        uses: actions/upload-artifact@v4
        with:
          name: linux-arm64-deb
          path: dist/*.deb
          retention-days: 1